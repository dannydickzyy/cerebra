<!-- Risk Prediction templates. Dynamic slots are supplied by static/js/app.js. -->

<!-- Markup for prediction input. Values come from the matching page controller. -->
<template id="prediction-input">
  <div class="form-group">
    <label class="form-label" for="{{key}}">{{label}}</label>
    <input
      class="form-control"
      id="{{key}}"
      name="{{key}}"
      type="{{type}}"
      value="{{value}}"
      {{attributes}}
      placeholder="{{placeholder}}"
    />
  </div>
</template>

<!-- Markup for prediction select. Values come from the matching page controller. -->
<template id="prediction-select">
  <div class="form-group">
    <label class="form-label" for="{{key}}">{{label}}</label>
    <select
      id="{{key}}"
      name="{{key}}"
      class="form-select"
      required
    >
      <option value="" disabled {{placeholder_selected}}>
        Select {{placeholder_label}}…
      </option>
      {{options}}
    </select>
  </div>
</template>

<!-- Markup for prediction option. Values come from the matching page controller. -->
<template id="prediction-option">
  <option value="{{value}}" {{selected}}>{{label}}</option>
</template>

<!-- Markup for prediction binary. Values come from the matching page controller. -->
<template id="prediction-binary">
  <div class="form-group">
    <div class="form-label" id="label-{{key}}">{{label}}</div>
    <div class="binary" role="radiogroup" aria-labelledby="label-{{key}}">
      {{options}}
    </div>
  </div>
</template>

<!-- Markup for prediction binary option. Values come from the matching page controller. -->
<template id="prediction-binary-option">
  <label>
    <input name="{{key}}" type="radio" value="{{value}}" required {{checked}} />
    <span>{{label}}</span>
  </label>
</template>

<!-- Markup for risk prediction. Values come from the matching page controller. -->
<template id="risk-prediction">
  <div class="grid prediction-grid">
    <section class="panel">
      <div class="form-intro">
        <div class="eyebrow">
          {{prediction_icon}} &nbsp; Risk prediction module
        </div>
        <h2>Patient health profile</h2>
        <p>
          Enter a profile to run the trained classifier. Review the model score
          and its contributing factors, then save the screening to your
          workspace.
        </p>
      </div>
      <form id="prediction-form">
        {{name_field}}
        <div class="row">
          <div class="col-6">{{age_field}}</div>
          <div class="col-6">{{gender_field}}</div>
        </div>
        <div class="row">
          <div class="col-6">{{glucose_field}}</div>
          <div class="col-6">
            {{bmi_field}}<label class="form-check-label mb-3">
              <input
                class="form-check-input me-2"
                type="checkbox"
                id="bmi_missing"
                name="bmi_missing"
                {{bmi_missing_checked}}
              />BMI unavailable</label
            >
          </div>
        </div>
        <div class="row">
          <div class="col-6">{{hypertension_field}}</div>
          <div class="col-6">{{heart_disease_field}}</div>
        </div>
        <div class="row">
          <div class="col-6">{{married_field}}</div>
          <div class="col-6">{{smoking_field}}</div>
        </div>
        <div class="row">
          <div class="col-6">{{work_field}}</div>
          <div class="col-6">{{residence_field}}</div>
        </div>
        {{site_field}}
        <div id="form-error">{{form_error}}</div>
        <div class="d-flex gap-2 flex-wrap mt-4">
          <button class="btn btn-primary" type="submit" {{submit_disabled}}>
            {{submit_icon}}{{submit_label}}
          </button>
          <button
            class="btn btn-outline-secondary"
            type="button"
            id="reset-form"
            {{reset_disabled}}
          >
            {{reset_icon}} Reset
          </button>
        </div>
        <p class="chart-caption mt-4">
          Supported input ranges follow the supplied dataset. Missing BMI uses
          the training median ({{bmi_median}}). Gender categories reflect the
          source data. Name and site are not model features.
        </p>
      </form>
    </section>
    <div class="stack" id="prediction-results">{{results}}</div>
  </div>
</template>

<!-- Markup for prediction error. Values come from the matching page controller. -->
<template id="prediction-error">
  <div class="form-error" role="alert">{{message}}</div>
</template>

<!-- Markup for prediction result. Values come from the matching page controller. -->
<template id="prediction-result">
  <div class="result-body">
    {{gauge}}{{risk_badge}}
    <h2 class="result-name">{{participant_name}}</h2>
    <p>
      {{score_description}} The label does not establish or rule out medical
      risk.
    </p>
    <div class="prediction-details">{{model_name}} · SMOTE · threshold 50%</div>
    <button id="save-screening" class="btn {{save_class}}" {{save_disabled}}>
      {{save_icon}}{{save_label}}</button
    >{{records_link}}
  </div>
</template>

<!-- Markup for prediction records link. Values come from the matching page controller. -->
<template id="prediction-records-link">
  <button class="link-button" data-nav="patients">
    Open screened patients {{arrow_icon}}
  </button>
</template>

<!-- Markup for prediction model context. Values come from the matching page controller. -->
<template id="prediction-model-context">
  <div class="mini-row">
    <span>Training source</span>
    <b>50,000 synthetic records</b>
  </div>
  <div class="mini-row">
    <span>Class balancing</span>
    <b>Training-only SMOTE</b>
  </div>
  <div class="mini-row">
    <span>Label threshold</span>
    <b>50% model score</b>
  </div>
  <div class="mini-row">
    <span>Clinical validation</span>
    <b>Not established</b>
  </div>
  <div class="notice orange mt-3">
    This system is for academic research. Model scores are not calibrated
    estimates of a person's likelihood of stroke. Do not use them to make
    clinical decisions.
  </div>
</template>
